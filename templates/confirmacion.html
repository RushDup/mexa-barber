<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cita enviada</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial;
        }

        body{
            background:#000;
            color:white;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .card{
            background:#111;
            padding:40px;
            border-radius:20px;
            text-align:center;
            width:400px;
            box-shadow:0 0 30px rgba(0,0,0,.5);
        }

        .icon{
            font-size:70px;
            color:#d4a85f;
            margin-bottom:20px;
        }

        h1{
            margin-bottom:15px;
            color:#d4a85f;
        }

        p{
            color:#aaa;
            margin-bottom:30px;
            line-height:1.6;
        }

        a{
            display:inline-block;
            background:#d4a85f;
            color:black;
            text-decoration:none;
            padding:14px 30px;
            border-radius:10px;
            font-weight:bold;
            transition:.3s;
        }

        a:hover{
            opacity:.8;
        }

    </style>

</head>
<body>

    <div class="card">

        <div class="icon">
            ✔
        </div>

        <h1>Solicitud enviada</h1>

        <p>
            Tu cita fue enviada correctamente.<br>
            Espera confirmación del barbero.
        </p>

        <a href="/">
            Volver al inicio
        </a>

    </div>

</body>
</html>
